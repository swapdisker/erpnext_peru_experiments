# All three jobs pass. The version-16 job is the only one that runs on
# MariaDB 11.8, whose stricter row locking the voucher counter has to cope
# with (see docs/HANDOVER.md, "Differences found on v16"). Passing tests on
# v16 do not make v16 supported: its desk entry is not built.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Pinned: a newer ruff may add rules and turn an unchanged tree red.
      - run: pip install ruff==0.16.9 num2words
      - run: ruff check .
      - run: ruff format --check .
      - name: JavaScript syntax
        run: for file in erpnext_peru/public/js/*.js; do node --check "$file"; done
      - name: Pure tests
        run: >
          python -m unittest
          erpnext_peru.tests.test_identity
          erpnext_peru.tests.test_voucher
          erpnext_peru.tests.test_amount_in_words
          erpnext_peru.tests.test_translations

  integration:
    name: Integration tests (ERPNext ${{ matrix.branch }}${{ matrix.experimental && ', experimental' || '' }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: version-15
            python: "3.12"
            node: "20"
            mariadb: "10.11"
            experimental: false
          - branch: version-16
            python: "3.14"
            node: "24"
            mariadb: "11.8"
            experimental: false
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          path: erpnext_peru
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Database client settings
        # Recent MariaDB clients insist on TLS by default; the service container
        # offers none ("SSL is required, but the server does not support it").
        # The [client-mariadb] group is read by MariaDB clients only, including
        # the ones bench starts itself.
        run: printf '[client-mariadb]\nskip-ssl\n' > ~/.my.cnf
      - name: Bench
        run: |
          pip install frappe-bench
          bench init frappe-bench --frappe-branch ${{ matrix.branch }} --skip-assets --skip-redis-config-generation --python "$(which python)"
          cd frappe-bench
          bench set-config -g redis_cache redis://127.0.0.1:6379/1
          bench set-config -g redis_queue redis://127.0.0.1:6379/2
          bench set-config -g redis_socketio redis://127.0.0.1:6379/1
          bench get-app erpnext --branch ${{ matrix.branch }} --skip-assets
          bench get-app erpnext_peru "$GITHUB_WORKSPACE/erpnext_peru" --skip-assets
      - name: Site
        working-directory: frappe-bench
        run: |
          mariadb --host 127.0.0.1 --port 3306 -uroot -proot -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"
          bench new-site test.localhost --db-host 127.0.0.1 --db-port 3306 --db-root-username root --db-root-password root --admin-password admin --mariadb-user-host-login-scope='%'
          bench --site test.localhost install-app erpnext erpnext_peru
          bench --site test.localhost set-config allow_tests true
      - name: Tests
        working-directory: frappe-bench
        run: bench --site test.localhost run-tests --app erpnext_peru
